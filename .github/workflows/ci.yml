name: CI
on: [push, pull_request]
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: "24"
          cache: npm
      - run: npm ci
      - run: npm run typecheck && npm run lint && npm test && npm run build && npm run check:release
      - run: npm audit --omit=dev --audit-level=high
      - name: Validate Compose configuration
        run: |
          token_file="$(mktemp)"
          trap 'rm -f "$token_file"' EXIT
          CLOUDFLARE_TUNNEL_TOKEN_FILE="$token_file" docker compose config --quiet
      - run: docker build -t reachwick:check .
      - run: bash .github/container-smoke.sh reachwick:check
  secrets:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
      - name: Scan complete Git history
        run: |
          docker run --rm -v "$PWD:/repo" zricethezav/gitleaks@sha256:b5918eb91b8d2473cec722f066abb4352e4ffdc4ec9f4283ec143aba9ec9ebc4 git /repo --redact --no-banner
  dependency-review:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/dependency-review-action@da24556b548a50705dd671f47852072ea4c105d9
